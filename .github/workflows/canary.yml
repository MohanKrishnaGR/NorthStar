# Nightly determinism canary (OPS_PLAN §1.4): re-run the pinned golden
# corpus and byte-compare. A diff here with no code change means the
# determinism contract broke somewhere environmental — the alert that
# matters most, fired by the golden dataset acting as a production monitor.
name: canary

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  golden-byte-canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install .[resume,dev]
      - run: pytest -q tests/test_gold.py tests/test_golden_t1.py tests/test_determinism.py

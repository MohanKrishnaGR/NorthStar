# GitHub Pages: the glass-box explorer, preloaded with the golden corpus.
# Pure static hosting — the emitted file is self-contained, so the Pages
# build needs Python only (the UI template is committed; no Node here).
# On Pages there is no /api; the workspace instead offers the in-browser
# Pyodide engine, so the site also ships the engine wheel and the golden
# corpus files (with a manifest) for the workspace's "▶ goldens/t1" button.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install .[resume]
      - name: emit the explorer over the golden corpus
        run: |
          mkdir -p _site
          python -m transformer run --input goldens/t1 \
            --config configs/default.json \
            --out /tmp/p.json --report /tmp/r.json \
            --as-of 2026-08 --emit-ui _site/index.html
      - name: publish the golden corpus for the in-browser workspace
        run: |
          mkdir -p _site/goldens/t1
          cp goldens/t1/* _site/goldens/t1/
          python -c "import json, pathlib; d = pathlib.Path('goldens/t1'); \
            pathlib.Path('_site/goldens/t1/manifest.json').write_text(json.dumps( \
            {'files': sorted(p.name for p in d.iterdir() if p.is_file())}))"
      - name: build the engine wheel for the in-browser workspace
        run: |
          pip wheel . --no-deps -w /tmp/wheel
          WHEEL=$(basename /tmp/wheel/candidate_transformer*.whl)
          cp "/tmp/wheel/$WHEEL" "_site/$WHEEL"
          echo "{\"wheel\": \"$WHEEL\"}" > _site/engine_wheel.json
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
